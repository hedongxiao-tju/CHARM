[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "charm-graph"
version = "1.2.2.post1"
description = "CHARM multimodal graph model"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "torch==2.11.0", "torchvision==0.26.0",
    "transformers==4.40.0", "tokenizers==0.19.1", "sentencepiece==0.1.99", "shortuuid",
    "accelerate==0.30.0", "peft==0.10.0", "bitsandbytes==0.45.5",
    "pydantic", "markdown2[all]", "numpy==1.26.4", "pandas==2.2.3", "scikit-learn==1.7.2", "torch-geometric==2.8.0",
    "gradio==4.16.0", "gradio_client==0.8.1",
    "requests", "httpx==0.24.0", "uvicorn", "fastapi",
    "einops==0.8.2", "einops-exts==0.0.4", "timm==1.0.27",
]

[project.optional-dependencies]
train = ["deepspeed==0.12.6", "ninja", "wandb"]
build = ["build", "twine"]

[tool.setuptools.packages.find]
exclude = ["assets*", "benchmark*", "docs", "dist*", "playground*", "scripts*", "tests*"]

[tool.wheel]
exclude = ["assets*", "benchmark*", "docs", "dist*", "playground*", "scripts*", "tests*"]
